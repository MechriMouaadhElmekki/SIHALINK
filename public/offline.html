<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>غير متصل — SIHALINK</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 1.5rem;
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: rgba(239,68,68,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; }
    p  { font-size: 0.875rem; color: #94a3b8; max-width: 320px; line-height: 1.6; }
    .emergency {
      margin-top: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      background: #dc2626;
      color: white;
      font-size: 1.25rem;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    button {
      padding: 0.625rem 1.25rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: transparent;
      color: #f8fafc;
      cursor: pointer;
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }
    button:hover { background: #1e293b; }
  </style>
</head>
<body>
  <div class="icon">📵</div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>
    أنت غير متصل حالياً. بعض المحتوى المحفوظ قد يكون متاحاً.
    للحالات الطارئة اتصل فوراً بالإسعاف.
  </p>
  <!-- Emergency number always accessible offline -->
  <a href="tel:1021" class="emergency">📞 1021 — إسعاف</a>
  <button onclick="window.location.reload()">🔄 إعادة المحاولة</button>
</body>
</html>
